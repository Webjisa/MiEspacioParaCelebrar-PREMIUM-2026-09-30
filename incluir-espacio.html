<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incluye tu espacio · MiEspacioParaCelebrar</title><link rel="stylesheet" href="styles.css?v=20261001-PREMIUM-MASTER"><link rel="stylesheet" href="premium-master.css?v=20261001-V2"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo-miespacio-oficial.png" alt="MiEspacio Para Celebrar"></a><nav><a href="espacios.html">Espacios</a><a href="como-funciona.html">Cómo funciona</a><a href="disponibilidad.html">Consulta tu fecha</a><a href="acceso.html">Área privada</a></nav></div></header><main><section class="page-intro"><div class="container"><p class="eyebrow">PROPIETARIOS</p><h1>Incluye tu espacio</h1><p>Cuéntanos qué espacio quieres incorporar a MiEspacioParaCelebrar.</p></div></section><section class="section"><div class="container"><form class="booking-card premium-lead-form" id="leadForm"><div class="admin-form-grid"><label>Nombre<input required name="name" autocomplete="name"></label><label>Teléfono<input required name="phone" autocomplete="tel"></label><label>Email<input required type="email" name="email" autocomplete="email"></label><label>Localidad<input required name="city" value="Lucena"></label><label>Nombre del espacio<input required name="space"></label><label>Capacidad aproximada<input type="number" min="1" name="capacity"></label><label class="form-wide">Descripción<textarea name="description" rows="4"></textarea></label><label class="form-wide">Comentarios<textarea name="notes" rows="4"></textarea></label></div><button class="btn btn-dark full" type="submit">Preparar solicitud</button><p id="leadMessage" class="message"></p></form></div></section></main><script>document.getElementById('leadForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const subject=encodeURIComponent('Solicitud para incluir espacio · '+(f.get('space')||''));const body=encodeURIComponent('Nombre: '+f.get('name')+'\nTeléfono: '+f.get('phone')+'\nEmail: '+f.get('email')+'\nLocalidad: '+f.get('city')+'\nEspacio: '+f.get('space')+'\nCapacidad: '+f.get('capacity')+'\nDescripción: '+f.get('description')+'\nComentarios: '+f.get('notes'));location.href='mailto:miespacioparacelebrar@gmail.com?subject='+subject+'&body='+body;document.getElementById('leadMessage').textContent='Hemos preparado el correo con los datos de tu solicitud.'})</script><script src="premium-master.js?v=20261001-V2"></script></body></html>
