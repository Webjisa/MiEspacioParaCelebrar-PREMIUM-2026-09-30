<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuesta · MiEspacioParaCelebrar</title><link rel="stylesheet" href="styles.css?v=20260928-1"><link rel="stylesheet" href="premium-master.css?v=20261001-V7-AFORO"></head><body><main><section class="section"><div class="container"><div class="booking-card"><p class="eyebrow">ENCUESTA</p><h1>Cuéntanos cómo ha ido</h1><p class="muted">Tu opinión se utiliza para mejorar el servicio. Este enlace es de un solo uso.</p><form id="surveyForm"><label>Valoración general<select id="overall" required><option value="">Selecciona</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Instalaciones<select id="facilities"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Limpieza<select id="cleaning"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Equipamiento<select id="equipment"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Mantenimiento<select id="maintenance"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>¿Volverías a utilizar el espacio?<select id="would"><option value="">—</option><option value="true">Sí</option><option value="false">No</option></select></label><label>¿Has tenido alguna incidencia?<select id="breakdown"><option value="false">No</option><option value="true">Sí</option></select></label><label>Detalles de incidencia<textarea id="breakdownDetails" rows="3"></textarea></label><label>¿Qué mejorarías?<textarea id="improvements" rows="3"></textarea></label><label>¿Qué elementos has echado en falta?<textarea id="missing" rows="3"></textarea></label><label>Comentarios<textarea id="comments" rows="4"></textarea></label><button class="btn btn-dark full" type="submit">Enviar encuesta</button><p id="surveyMessage" class="message"></p></form></div></div></section></main><script src="supabase-config.js?v=final"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const u=new URLSearchParams(location.search).get('token');const c=window.supabase?.createClient('https://hvuseljtqdgekotrsiwd.supabase.co',window.MIESPACIO_SUPABASE_ANON_KEY);document.querySelector('#surveyForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.querySelector('#surveyMessage');if(!u){m.textContent='Enlace no válido.';return;}m.textContent='Enviando…';const b=id=>document.querySelector(id).value;const r=await c.rpc('submit_survey',{p_token:u,p_overall:Number(b('#overall')),p_facilities:b('#facilities')?Number(b('#facilities')):null,p_cleaning:b('#cleaning')?Number(b('#cleaning')):null,p_equipment:b('#equipment')?Number(b('#equipment')):null,p_maintenance:b('#maintenance')?Number(b('#maintenance')):null,p_improvements:b('#improvements')||null,p_breakdown:b('#breakdown')==='true',p_breakdown_details:b('#breakdownDetails')||null,p_missing_items:b('#missing')||null,p_would_use_again:b('#would')===''?null:b('#would')==='true',p_comments:b('#comments')||null});if(r.error)m.textContent=r.error.message;else{m.textContent='Gracias. La encuesta se ha registrado correctamente.';document.querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=true);}});</script><script src="premium-master.js?v=20261001-V7-AFORO"></script></body></html>
