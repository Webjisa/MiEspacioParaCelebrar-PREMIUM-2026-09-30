<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisión de reserva · MiEspacioParaCelebrar</title>
<link rel="stylesheet" href="styles.css?v=20260930">
<style>
.decision-card{background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:32px;box-shadow:0 8px 24px rgba(52,66,52,.06)}
.decision-action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid #d2d5c8;border-radius:999px;background:#cacdbd;color:#344234;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer}
.decision-action:hover{background:#c1c6b3;border-color:#c1c6b3;color:#344234}
.decision-action[disabled]{opacity:.6;cursor:wait}
</style>
<link rel="stylesheet" href="premium-master.css?v=20261002-V11-PREMIUM"></head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="MiEspacioParaCelebrar">
      <img class="brand-logo" src="logo-miespacio-oficial.png" alt="MiEspacio Para Celebrar">
    </a>
    <nav>
      <a href="espacios.html">Espacios</a>
      <a href="como-funciona.html">Cómo funciona</a>
      <a href="area-privada.html">Área privada</a>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container" style="max-width:700px">
      <div class="decision-card" id="decisionCard" style="text-align:center">
        <p class="eyebrow">MiEspacioParaCelebrar</p>
        <h1 id="title">Decisión de reserva</h1>
        <p id="message" class="muted">Comprobando el enlace…</p>
        <div id="actions" style="margin-top:24px"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-inner">
    <div class="footer-brand-block">
      <div class="footer-brand"><strong>MiEspacioParaCelebrar</strong></div>
    </div>
  </div>
</footer>

<script>
(() => {
  const SUPABASE_URL = 'https://hvuseljtqdgekotrsiwd.supabase.co';
  const ACTION_URL = `${SUPABASE_URL}/functions/v1/booking-action`;
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const action = params.get('action') || '';
  const title = document.querySelector('#title');
  const message = document.querySelector('#message');
  const actions = document.querySelector('#actions');

  const labels = {
    confirm: ['Aceptar solicitud', '¿Quieres aceptar esta solicitud de reserva?'],
    reject: ['Rechazar solicitud', '¿Quieres rechazar esta solicitud de reserva?']
  };

  if (!token || !labels[action]) {
    title.textContent = 'Enlace no válido';
    message.textContent = 'El enlace de decisión no es válido o está incompleto.';
    return;
  }

  title.textContent = labels[action][0];
  message.textContent = labels[action][1];
  actions.innerHTML = `
    <button id="doAction" class="decision-action">${labels[action][0]}</button>
    <a class="decision-action" href="area-privada.html" style="margin-left:8px">Volver al área privada</a>
  `;

  document.querySelector('#doAction').addEventListener('click', async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    message.textContent = 'Procesando…';
    try {
      const response = await fetch(ACTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, action })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'No se pudo procesar la solicitud.');
      title.textContent = action === 'confirm' ? 'Solicitud aceptada' : 'Solicitud rechazada';
      message.textContent = action === 'confirm'
        ? 'La reserva ha quedado confirmada y se ha enviado el aviso correspondiente.'
        : 'La solicitud ha quedado rechazada y se ha enviado el aviso correspondiente.';
      actions.innerHTML = '<a class="decision-action" href="area-privada.html">Ir al área privada</a>';
    } catch (error) {
      message.textContent = error.message || 'No se pudo procesar la solicitud.';
      button.disabled = false;
    }
  });
})();
</script>
<script src="premium-master.js?v=20261002-V11-PREMIUM"></script></body>
</html>
